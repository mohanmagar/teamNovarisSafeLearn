<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="images/safelearn-icon.svg">
  <title>SafeLearn - Quiz</title>
  <meta name="description" content="Gamified Knowledge Check">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    .quiz-card { max-width: 700px; margin: 0 auto; position: relative; overflow: hidden; }
    .option-btn {
      width: 100%; text-align: left; padding: 16px 20px; margin-bottom: 12px;
      background: rgba(255,255,255,0.05); border: 1px solid var(--border);
      border-radius: var(--radius-btn); color: var(--text-primary);
      font-size: 1.1rem; cursor: pointer; transition: 0.2s;
    }
    .option-btn:hover { background: rgba(255,255,255,0.1); }
    .option-btn.selected { border-color: var(--iris-cyan); background: rgba(0,212,255,0.12); }
    .option-btn.correct { border-color: var(--success); background: rgba(63,185,80,0.1); }
    .option-btn.wrong { border-color: var(--danger); background: rgba(248,81,73,0.1); }
    .top-bar { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; }
    .streak { color: var(--accent-orange); animation: pulse 2s infinite; }
    
    .result-screen { text-align: center; display: none; }
    .result-screen.pass .glass-card { box-shadow: 0 0 40px rgba(63,185,80,0.2); border-color: var(--success); }
    .result-screen.fail .glass-card { box-shadow: 0 0 40px rgba(248,81,73,0.2); border-color: var(--danger); }
    .score-huge { font-size: 4rem; font-weight: bold; margin: 20px 0; }
  </style>
  <link rel="stylesheet" href="css/mobile.css">
  <script src="js/mobile.js" defer></script>
</head>
<body>
  <nav class="navbar">
    <a href="dashboard.html" class="navbar-brand">
      <img src="images/safelearn-icon.svg" alt="SafeLearn logo" style="height:32px; width:auto;">
      <span style="font-size:1.1rem; font-weight:800; color:var(--text-primary); margin-left:6px;">SafeLearn</span>
    </a>
    <div class="navbar-nav">
      <a href="dashboard.html" class="nav-link">← Dashboard</a>
      <span class="streak" id="streak-counter" style="display:none;align-items:center;gap:4px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="color:#FF6B00;flex-shrink:0;"><path d="M12 23c-3.9 0-7-3.1-7-7 0-2.4 1.2-4.6 3.3-5.9.3-.2.7 0 .7.4v.9c0 .8.7 1.4 1.5 1.2.5-.1.9-.6.9-1.1V8c0-.4.4-.7.8-.5C14.7 9 17 11.9 17 15.2V16c0 .5.4.9.9.9s.9-.4.9-.9c0-.3.4-.5.6-.3C20.4 17 21 18.4 21 20c0 1.7-2.6 3-9 3z"/></svg>
        x<span id="streak-num">0</span>
      </span>
      <span class="badge badge-xp" id="session-xp">0 XP Earned</span>
    </div>
  </nav>

  <div class="container" style="max-width: 800px;">
    
    <div id="quiz-container">
      <div class="top-bar">
        <span id="q-counter">Question 1 of 5</span>
      </div>
      <div class="progress-container" style="margin-bottom: 30px;"><div class="progress-bar progress-yellow" id="q-progress" style="width: 20%;"></div></div>
      
      <div class="glass-card quiz-card animate-slide-up" id="q-card">
        <span class="badge" style="margin-bottom:16px;">Q<span id="q-num">1</span></span>
        <h2 id="q-text" style="font-size: 1.5rem; margin-bottom: 24px;">Question text here?</h2>
        
        <div id="options-container"></div>
        
        <div style="margin-top: 24px; text-align: right;">
          <button class="btn btn-primary" id="btn-confirm" onclick="confirmAnswer()" style="display:none;">Confirm Answer</button>
          <button class="btn btn-primary" id="btn-next" onclick="nextQuestion()" style="display:none;">Next Question →</button>
        </div>
      </div>
    </div>

    <!-- Results Screen -->
    <div id="result-container" class="result-screen animate-slide-up">
      <div class="glass-card" id="result-card">
        <h2 id="res-title">Results</h2>
        <div class="score-huge" id="res-score">0 / 5</div>
        <p class="text-muted" id="res-msg">Percentage</p>
        
        <div style="background:rgba(0,0,0,0.25); border:1px solid var(--glass-border); padding:20px; border-radius:12px; margin:24px 0; text-align:left;">
          <div style="display:flex; justify-content:space-between; margin-bottom:10px;"><span>Base Module XP:</span> <span id="xp-base" class="text-success">+0</span></div>
          <div style="display:flex; justify-content:space-between; margin-bottom:10px;"><span>Streak Bonus (Best Streak):</span> <span id="xp-streak" class="text-success">+0</span></div>
          <div style="display:flex; justify-content:space-between; margin-bottom:10px; border-bottom:1px solid var(--border); padding-bottom:10px;"><span>Perfect Score Bonus:</span> <span id="xp-comp" class="text-success">+0</span></div>
          <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:1.2rem; margin-top:10px;"><span>XP Earned This Quiz:</span> <span id="xp-total" style="color:var(--iris-cyan);">+0 XP</span></div>
          <div style="display:flex; justify-content:space-between; font-size:0.85rem; color:var(--text-muted); margin-top:8px;"><span>Total Account XP:</span> <span id="xp-acc-total" style="color:var(--text-primary);font-weight:600;">Updating…</span></div>
        </div>
        
        <div id="res-actions" style="display:flex; gap:16px; justify-content:center;">
          <!-- Injected dynamically -->
        </div>
      </div>
    </div>

  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    checkAuth();
    const urlParams = new URLSearchParams(window.location.search);
    const moduleId = urlParams.get('module');
    if (!moduleId) window.location.href = 'dashboard.html';

    const QUIZ_DATA = {
      hazard: [
        { q: "What does the acronym STOP stand for in hazard control?", options: ["Survey", "Stop, Think, Observe, Protect", "Safety, Train, Operate, Plan", "Survey, Test, Observe, Prevent"], ans: 1 },
        { q: "Under the Health and Safety at Work Act 1974, who has a duty to report hazards?", options: ["Employer only", "Safety officer only", "Both employer and employee", "Manager only"], ans: 2 },
        { q: "A wet floor with no signage in a loading bay is an example of?", options: ["Unsafe act", "Unsafe condition", "Near miss", "RIDDOR event"], ans: 1 },
        { q: "What percentage of warehouse accidents are considered preventable?", options: ["30%", "50%", "70%", "90%"], ans: 2 },
        { q: "What should you do FIRST when you spot a hazard?", options: ["Report it", "Call a manager", "Make the area safe if possible", "Leave it for maintenance"], ans: 2 }
      ],
      manual: [
        { q: "What does TILE stand for?", options: ["Task, Individual, Load, Environment", "Transfer, Inspect, Lift, Evaluate", "Task, Inspect, Lower, Equipment", "None of these"], ans: 0 },
        { q: "What is the recommended maximum lift weight guideline for men?", options: ["15kg", "20kg", "25kg", "30kg"], ans: 2 },
        { q: "Which regulation covers manual handling at work?", options: ["HASAWA 1974", "RIDDOR 2013", "Manual Handling Operations Regulations 1992", "PUWER 1998"], ans: 2 },
        { q: "Safe lifting position requires:", options: ["Straight legs, bent back", "Bent knees, straight back, load close", "Twisted spine, arms extended", "Feet together, lean forward"], ans: 1 },
        { q: "Before lifting, the FIRST step in the hierarchy is:", options: ["Reduce the risk", "Assess the risk", "Avoid the lift entirely if possible", "Provide PPE"], ans: 2 }
      ],
      unsafe: [
        { q: "According to Heinrich's Triangle, how many near-misses occur for every fatal accident?", options: ["30", "100", "300", "600"], ans: 2 },
        { q: "Removing a machine guard to work faster is an example of:", options: ["An unsafe act", "An unsafe condition", "A near miss", "A RIDDOR event"], ans: 0 },
        { q: "Under HASAWA 1974 Section 7, employees must:", options: ["Avoid reporting minor incidents", "Report unsafe conditions and cooperate with safety measures", "Only follow instructions from supervisors", "Report only injuries causing lost time"], ans: 1 },
        { q: "A near-miss report should be submitted:", options: ["Only if someone was hurt", "Only if equipment was damaged", "Within one week", "Before the end of the shift"], ans: 3 },
        { q: "The FIRST action after identifying a near-miss is:", options: ["Submit a report", "Tell a colleague", "Make the area immediately safe", "Wait for a manager"], ans: 2 }
      ],
      height: [
        { q: "Under the Work at Height Regulations 2005, what is the FIRST step in the hierarchy?", options: ["Use guardrails", "Use a harness", "Use existing safe places", "Avoid working at height entirely"], ans: 3 },
        { q: "Three points of contact on a ladder means:", options: ["Both feet + one hand OR both hands + one foot", "Both hands + one foot OR both feet + one hand", "Two feet + two hands", "One foot + one hand"], ans: 1 },
        { q: "A mezzanine floor is most at risk from:", options: ["Poor lighting", "Overloading beyond rated capacity", "Slippery surfaces", "Electrical faults"], ans: 1 },
        { q: "Toe boards on elevated platforms are used to:", options: ["Prevent slipping on the platform", "Prevent objects falling off the edge", "Indicate maximum load", "Signal restricted areas"], ans: 1 },
        { q: "Before using racking as a work platform, you must:", options: ["Get verbal permission from a supervisor", "Paint the racking yellow", "Inspect it and confirm it is designed and rated for access", "Sign a disclaimer"], ans: 2 }
      ]
    };

    const questions = QUIZ_DATA[moduleId];
    let currentQ = 0;
    let score = 0;
    let streak = 0;
    let maxStreak = 0;
    let sessionXP = 0;
    let selectedOpt = null;

    function renderQuestion() {
      const q = questions[currentQ];
      document.getElementById('q-counter').innerText = `Question ${currentQ + 1} of 5`;
      document.getElementById('q-progress').style.width = `${((currentQ + 1) / 5) * 100}%`;
      document.getElementById('q-num').innerText = currentQ + 1;
      document.getElementById('q-text').innerText = q.q;
      
      const optsContainer = document.getElementById('options-container');
      optsContainer.innerHTML = '';
      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => selectOption(btn, idx);
        optsContainer.appendChild(btn);
      });
      
      document.getElementById('btn-confirm').style.display = 'none';
      document.getElementById('btn-next').style.display = 'none';
      selectedOpt = null;
    }

    function selectOption(btn, idx) {
      if (document.getElementById('btn-next').style.display === 'inline-flex') return; // already answered
      document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedOpt = idx;
      document.getElementById('btn-confirm').style.display = 'inline-flex';
    }

    function confirmAnswer() {
      if (selectedOpt === null) return;
      document.getElementById('btn-confirm').style.display = 'none';
      const q = questions[currentQ];
      const btns = document.querySelectorAll('.option-btn');
      
      if (selectedOpt === q.ans) {
        btns[selectedOpt].classList.add('correct');
        score++;
        streak++;
        if (streak > maxStreak) maxStreak = streak;
        let xpGained = 10;
        if (streak >= 3) {
          xpGained += 5;
          showToast(`Streak bonus active! +5 XP (Streak x${streak})`, 'info');
        } else {
          showToast(`+10 XP!`, 'success');
        }
        sessionXP += xpGained;
        updateStats();
      } else {
        btns[selectedOpt].classList.add('wrong');
        btns[q.ans].classList.add('correct');
        streak = 0;
        showToast('Incorrect', 'error');
        updateStats();
      }
      
      btns.forEach(b => b.onclick = null); // disable clicks
      document.getElementById('btn-next').style.display = 'inline-flex';
      
      if (currentQ === questions.length - 1) {
        document.getElementById('btn-next').innerText = 'Finish Quiz →';
      }
    }

    function updateStats() {
      const sCounter = document.getElementById('streak-counter');
      if (sCounter) {
        if (streak >= 2) {
          sCounter.style.display = 'inline-flex';
          document.getElementById('streak-num').innerText = streak;
        } else {
          sCounter.style.display = 'none';
        }
      }
      document.getElementById('session-xp').innerText = `${sessionXP} XP Earned`;
    }

    function nextQuestion() {
      if (currentQ < questions.length - 1) {
        currentQ++;
        const card = document.getElementById('q-card');
        card.classList.remove('animate-slide-up');
        void card.offsetWidth;
        card.classList.add('animate-slide-up');
        renderQuestion();
      } else {
        showResults();
      }
    }

    async function showResults() {
      document.getElementById('quiz-container').style.display = 'none';
      const resContainer = document.getElementById('result-container');
      resContainer.style.display = 'block';
      
      const percent = (score / 5) * 100;
      const passed = percent >= 80;
      
      resContainer.classList.add(passed ? 'pass' : 'fail');
      document.getElementById('res-score').innerText = `${score} / 5`;
      document.getElementById('res-score').style.color = passed ? 'var(--success)' : 'var(--danger)';
      document.getElementById('res-title').innerText = passed ? 'Congratulations! You Passed!' : 'Keep trying!';
      document.getElementById('res-msg').innerText = `${percent}% - ${passed ? 'Great job mastering this topic.' : 'Review the module and try again.'}`;
      
      const modMeta = MODULES.find(m => m.id === moduleId);
      const baseXP = passed ? (modMeta ? modMeta.xpReward : 100) : 0;
      // Best streak across all questions guarantees bonus is never lost on final question
      const streakBonus = passed ? getStreakBonus(maxStreak) : 0;
      const compBonus = (passed && score === 5) ? 25 : 0;
      const totalEarned = baseXP + streakBonus + compBonus;
      
      document.getElementById('xp-base').innerText = `+${baseXP}`;
      document.getElementById('xp-streak').innerText = maxStreak >= 2 ? `+${streakBonus} (${maxStreak} in a row)` : `+${streakBonus}`;
      document.getElementById('xp-comp').innerText = `+${compBonus}`;
      document.getElementById('xp-total').innerText = `+${totalEarned} XP`;
      
      const actions = document.getElementById('res-actions');
      if (passed) {
        try { if (typeof confetti === 'function') confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } }); } catch {}
        actions.innerHTML = `<span class="text-muted">Saving your result…</span>`;
        try {
          const result = await completeModuleOnServer(moduleId, { streakBonus, compBonus });
          if (document.getElementById('xp-acc-total')) {
            document.getElementById('xp-acc-total').innerText = `${result.xp} XP`;
          }
          if (document.getElementById('user-xp')) document.getElementById('user-xp').innerText = `${result.xp} XP`;
        } catch (err) {
          showToast('Could not save your result to the server: ' + err.message, 'error');
        }
        actions.innerHTML = `
          <a href="certificate.html?module=${moduleId}" class="btn btn-primary">Download Certificate</a>
          <a href="dashboard.html" class="btn btn-secondary">Back to Dashboard</a>
        `;
      } else {
        actions.innerHTML = `
          <button onclick="location.reload()" class="btn btn-primary">Retake Quiz</button>
          <a href="module.html?module=${moduleId}" class="btn btn-secondary">Review Module</a>
        `;
      }
    }

    renderQuestion();
  </script>
</body>
</html>
